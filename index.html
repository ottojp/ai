<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impostor – Partyspel</title>
  <meta name="description" content="Ett socialt ordspel där en eller två impostors bluffar sig igenom ronderna.">
  <style>
    :root{
      --bg:#0f0f17; --panel:#171826; --card:#1e2032; --text:#fff;
      --muted:#b7b7c9; --accent:#6a5acd; --accent2:#9f8bff; --ok:#00d084; --warn:#ffb020; --bad:#ff4d4d;
      --r:16px; --shadow:0 14px 40px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0d0d14 0%, #15162b 100%);color:var(--text);
         font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;}
    header{max-width:980px;margin:24px auto 0;padding:0 16px;text-align:center}
    h1{margin:.2rem 0 0;font-size:clamp(1.8rem,3.8vw,3rem);
       background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
    .sub{opacity:.75;margin:.2rem 0 0}
    main{max-width:980px;margin:18px auto;padding:16px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
    .row{display:grid;gap:12px}
    @media(min-width:760px){.row-2{grid-template-columns:1fr 1fr}}
    .btn{appearance:none;border:0;cursor:pointer;background:var(--accent);color:#fff;border-radius:12px;
         padding:10px 16px;font-weight:700;transition:.18s;display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn:hover{transform:translateY(-1px);background:var(--accent2)}
    .btn.outline{background:transparent;border:1px solid rgba(255,255,255,.18)}
    .grid{display:grid;gap:12px}
    .players li{display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 10px}
    input[type="text"], select, input[type="number"], input[type="range"]{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      background:#0e0f1a;color:#fff
    }
    input[type="range"]{padding:0}
    .hint{font-size:.94rem;opacity:.82}
    .pill{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border-radius:999px;background:#0e0f1a;border:1px solid rgba(255,255,255,.12)}
    .tag{background:#0e0f1a;border:1px dashed rgba(255,255,255,.18);padding:.35rem .6rem;border-radius:999px;opacity:.85}
    .title{margin:.2rem 0 1rem;font-size:1.35rem;color:#e5e5ff}
    .stack{display:flex;flex-wrap:wrap;gap:10px}
    .center{display:flex;justify-content:center;align-items:center}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
    footer{opacity:.55;text-align:center;margin:24px 0}
    .sep{height:1px;background:linear-gradient(90deg,transparent, rgba(255,255,255,.15), transparent);margin:10px 0 14px}
    .small{font-size:.9rem;opacity:.85}
    .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px}
    .pill-lg{font-size:1.05rem;padding:.5rem .8rem}

    /* Flip card – stilar */
    .flip-container {
      perspective: 1200px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }
    .flip-card {
      width: 100%;
      min-height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
      border-radius: 14px;
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-side {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: .4rem;
    }
    .flip-front {
      background: #0e0f1a;
      border: 1px solid rgba(255,255,255,.12);
    }
    .flip-back {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.18);
      transform: rotateY(180deg);
    }
    .role-title { margin: 0 0 .4rem 0; }
    .secret-wrap {
      margin-top: .6rem;
      text-align: center;
      display: grid;
      gap: .25rem;
    }
    .secret-word { font-size: 1.35rem; font-weight: 800; letter-spacing: .3px; }
    .flip-button { margin-top: 10px; }
    /* Rösträkning – klickbara kort */
    .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
    .pick{background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;cursor:pointer;transition:.18s}
    .pick:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.28)}
  </style>
</head>
<body>
  <header>
    <h1>Impostor – Partyspel</h1>
    <p class="sub">Starta runda, visa roller en‑och‑en, diskutera och rösta IRL – sedan registrera resultat här.</p>
  </header>

  <main id="app"></main>

  <footer>© 2026 Otto – GitHub Pages</footer>

  <script>
    /***************
     * KATEGORIER – Svenska med svårare ledtrådar
     ***************/
    const CATEGORIES = [
      { id: "frukt", name: "Frukt", words: {
        easy:   [
          {word:"Äpple",       hint:"Kärnhus, ofta vaxblankt skal"},
          {word:"Banan",       hint:"Egentligen ett bär från en ört"}
        ],
        medium: [
          {word:"Apelsin",     hint:"Citrus med bittert skal och klyftor"},
          {word:"Kiwi",        hint:"Grönt fruktkött med svarta frön"}
        ],
        hard:   [
          {word:"Granatäpple", hint:"Arillus runt massor av frön"},
          {word:"Kvitten",     hint:"Stenhård, doftande – blir ätlig efter kokning"}
        ]
      }},

      { id: "djur", name: "Djur", words: {
        easy:   [
          {word:"Hund",        hint:"Tam canid – vallning och vakthållning"},
          {word:"Katt",        hint:"Nattaktiv jägare med morrhår"}
        ],
        medium: [
          {word:"Uggla",       hint:"Tyst vingflykt, framåtriktade ögon"},
          {word:"Säl",         hint:"Fenfötter, viloplatser på skär"}
        ],
        hard:   [
          {word:"Okapi",       hint:"Zebrarandig släkting till giraff"},
          {word:"Näbbdjur",    hint:"Äggläggande däggdjur med giftsporre"}
        ]
      }},

      { id: "sport", name: "Sport", words: {
        easy:   [
          {word:"Fotboll",     hint:"Offside, hörna, elva mot elva"},
          {word:"Tennis",      hint:"Serve, ess, tiebreak"}
        ],
        medium: [
          {word:"Handboll",    hint:"Kantavslut och 6‑meterslinje"},
          {word:"Orientering", hint:"Kontrollskärm och stämpling"}
        ],
        hard:   [
          {word:"Curling",     hint:"Hus, hog line och sopning"},
          {word:"Fäktning",    hint:"Parér, ripost, florett"}
        ]
      }},

      { id: "lander", name: "Länder", words: {
        easy:   [
          {word:"Brasilien",   hint:"Amazonas och kust mot Atlanten"},
          {word:"Kanada",      hint:"Lönnlöv och stora provinser"}
        ],
        medium: [
          {word:"Argentina",   hint:"Pampas, mate och tango"},
          {word:"Egypten",     hint:"Nildeltat och hieroglyfer"}
        ],
        hard:   [
          {word:"Danmark",     hint:"Jylland och ett pärlband av öar"},
          {word:"Island",      hint:"Gejsrar, basalt och sagor"}
        ]
      }},

      { id: "farger", name: "Färger", words: {
        easy:   [
          {word:"Röd",         hint:"Additiv primär med hög värmeassociation"},
          {word:"Blå",         hint:"Additiv primär, kall ton"}
        ],
        medium: [
          {word:"Grön",        hint:"Klorofyllens signatur"},
          {word:"Orange",      hint:"Mellanting av röd och gul"}
        ],
        hard:   [
          {word:"Gul",         hint:"Subtraktiv primär i CMY"},
          {word:"Purpur",      hint:"Antik färg från snäckdjur"}
        ]
      }},

      { id: "fordon", name: "Fordon", words: {
        easy:   [
          {word:"Bil",         hint:"Kaross, chassi och körfält"},
          {word:"Cykel",       hint:"Kedja, drev och ekrar"}
        ],
        medium: [
          {word:"Tåg",         hint:"Räls, kontaktledning och vagnar"},
          {word:"Båt",         hint:"Köl, akter och för"}
        ],
        hard:   [
          {word:"Flygplan",    hint:"Tryckkabin och vingprofil"},
          {word:"Luftskepp",   hint:"Bärgas blandas ej med flygplan"}
        ]
      }},
    ];

    /*************** Hjälpmedel ***************/
    const randInt = max => crypto.getRandomValues(new Uint32Array(1))[0] % max;
    const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=randInt(i+1); [a[i],a[j]]=[a[j],a[i]]} return a; };
    const byId = id => document.getElementById(id);
    const fmt = n => String(n).padStart(2,"0");
    const clamp = (n,min,max) => Math.max(min, Math.min(max,n));

    /*************** Spel‑state ***************/
    const state = {
      phase: "playerCount", // Starta med välj antal spelare
      players: Array.from({length:4}, (_,i)=>({id:i, name:`Spelare ${i+1}`, isImposter:false, score:0})),
      nextId: 10,
      selectedCategories: [],
      settings: { difficulty:"medium", imposterCount:1, hintsEnabled:true },
      secretWord:"", secretCategory:"", secretHint:"",
      roundNumber:1, currentRevealIndex:0, speakingOrder: null,
      tallyTargetId: null // IRL vald spelare (eller null = ingen tydlig majoritet)
    };

    function maxImposters(){ return Math.min(2, Math.floor(state.players.length/3)); }

    function getRandomWord(selectedIds, difficulty){
      const pool = (selectedIds.length? CATEGORIES.filter(c=>selectedIds.includes(c.id)) : CATEGORIES);
      const cat = pool.length ? pool[randInt(pool.length)] : CATEGORIES[0];
      const list = cat.words[difficulty] ?? cat.words.medium ?? cat.words.easy;
      const pick = list[randInt(list.length)];
      return { word: pick.word, category: cat.name, hint: pick.hint ?? "" };
    }

    /*************** Tillståndsändringar ***************/
    function setPlayerCount(n){
      n = clamp(Math.round(Number(n)||4), 3, 10);
      const current = state.players.length;
      if(n > current){
        for(let i=current; i<n; i++){
          state.players.push({id: state.nextId++, name:`Spelare ${i+1}`, isImposter:false, score:0});
        }
      } else if(n < current){
        state.players.splice(n);
      }
      if(state.settings.imposterCount > maxImposters()){
        state.settings.imposterCount = maxImposters();
      }
      render.players?.();
    }

    function addPlayer(){ if(state.players.length>=10) return; setPlayerCount(state.players.length+1); render(); }
    function removePlayer(){ if(state.players.length<=3) return; setPlayerCount(state.players.length-1); render(); }
    function updatePlayerName(id, name){ const p=state.players.find(p=>p.id===id); if(p){p.name=name; render.players?.()} }
    function toggleCategory(id){ const s=state.selectedCategories; const i=s.indexOf(id); if(i>=0) s.splice(i,1); else s.push(id); render(); }
    function selectAllCategories(){ state.selectedCategories = CATEGORIES.map(c=>c.id); render(); }
    function deselectAllCategories(){ state.selectedCategories = []; render(); }

    function startRound(){
      const {word, category, hint} = getRandomWord(state.selectedCategories, state.settings.difficulty);
      state.secretWord = word; state.secretCategory = category; state.secretHint = hint;

      let players = shuffle(state.players).map(p=>({...p, isImposter:false}));
      for(let i=0; i<Math.min(state.settings.imposterCount, players.length); i++) players[i].isImposter=true;
      state.players = shuffle(players);

      state.currentRevealIndex = 0;
      state.speakingOrder = shuffle(state.players);
      state.tallyTargetId = null;
      state.phase = "roleReveal";
      render();
    }

    function endRound(selectedId){
      // IRL röst: selectedId = spelare som fick flest pekningar (eller null)
      state.tallyTargetId = selectedId===undefined ? null : selectedId;
      applyScores();
      state.phase = "results";
      render();
    }

    function getResults(){
      const imposters = state.players.filter(p=>p.isImposter);
      const selectedId = state.tallyTargetId;
      const selectedIsImposter = selectedId!=null && imposters.some(i=>i.id===selectedId);
      const crewWon = selectedIsImposter;               // Om vald = impostor -> Crew vann
      const imposterWon = !crewWon;                     // Annars vann impostors (även vid oavgjort)
      const selectedName = selectedId==null ? "—" : (state.players.find(p=>p.id===selectedId)?.name ?? "—");
      return { imposters, selectedId, selectedName, crewWon, imposterWon };
    }

    function applyScores(){
      const {crewWon} = getResults();
      state.players = state.players.map(p=>{
        if(p.isImposter){
          return {...p, score: p.score + (crewWon ? 0 : 20)};
        } else {
          return {...p, score: p.score + (crewWon ? 10 : 0)};
        }
      });
      state.roundNumber++;
    }

    function playAgain(){
      state.players = state.players.map(p=>({...p, isImposter:false}));
      state.currentRevealIndex = 0;
      state.phase = "settings";
      render();
    }
    function resetScores(){ state.players = state.players.map(p=>({...p, score:0})); state.roundNumber=1; render(); }
    function resetGame(){
      state.phase="playerCount";
      state.players = Array.from({length:4}, (_,i)=>({id:i, name:`Spelare ${i+1}`, isImposter:false, score:0}));
      state.nextId=10; state.selectedCategories=[]; state.settings={difficulty:"medium", imposterCount:1, hintsEnabled:true};
      state.secretWord=""; state.secretCategory=""; state.secretHint=""; state.roundNumber=1; state.speakingOrder=null; state.currentRevealIndex=0; state.tallyTargetId=null;
      render();
    }

    /*************** Render ***************/
    const app = byId("app");
    function html(strings,...vals){ return strings.map((s,i)=>s+(vals[i]??"")).join(""); }

    function renderPlayerCount(){
      const n = state.players.length;
      app.innerHTML = html`
        <section class="card grid" style="max-width:760px;margin-inline:auto">
          <div class="title">👥 Välj antal spelare</div>
          <p class="hint">Välj hur många som ska vara med (3–10). Du kan byta senare.</p>

          <div class="grid">
            <div class="stack" style="align-items:center">
              <span class="pill pill-lg">Antal: <b id="pcount">${n}</b></span>
              <input type="range" id="pRange" min="3" max="10" step="1" value="${n}" />
              <input type="number" id="pInput" min="3" max="10" value="${n}" />
            </div>

            <div class="choices">
              ${[3,4,5,6,7,8,9,10].map(x=>html`
                <button class="btn outline" data-quick="${x}">${x}</button>
              `).join("")}
            </div>
          </div>

          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="next">Fortsätt</button>
            <span class="tag">Tips: Du kan namnge spelare på nästa skärm.</span>
          </div>
        </section>
      `;
      const pCount = byId("pcount");
      const pRange = byId("pRange");
      const pInput = byId("pInput");

      const sync = (val)=>{
        setPlayerCount(val);
        pCount.textContent = state.players.length;
        pRange.value = state.players.length;
        pInput.value = state.players.length;
      };

      pRange.oninput = e => sync(e.target.value);
      pInput.oninput = e => sync(e.target.value);
      app.querySelectorAll('[data-quick]').forEach(btn=>btn.onclick = ()=> sync(btn.dataset.quick));
      pInput.addEventListener('keyup', (e)=>{ if(e.key==='Enter') byId('next').click(); });
      byId("next").onclick = ()=>{ state.phase = "categories"; render(); };
    }

    function renderHome(){
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">👥 Spelare</div>
          <ul class="grid players" id="players">
            ${state.players.map((p,i)=>html`
              <li>
                <span class="pill">#${i+1}</span>
                <input type="text" value="${p.name}" aria-label="Namn" data-id="${p.id}">
                <span class="right tag">Poäng: ${p.score}</span>
              </li>
            `).join("")}
          </ul>
          <div class="stack">
            <button class="btn" id="add">+ Lägg till</button>
            <button class="btn outline" id="remove">– Ta bort</button>
            <span class="tag">Minst 3, max 10 spelare</span>
          </div>
          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="toCats">Välj kategorier</button>
            <button class="btn outline" id="toSettings">Inställningar</button>
          </div>
        </section>
      `;
      byId("add").onclick = addPlayer;
      byId("remove").onclick = removePlayer;
      byId("toCats").onclick = ()=>{ state.phase="categories"; render(); };
      byId("toSettings").onclick = ()=>{ state.phase="settings"; render(); };
      app.querySelectorAll('input[type="text"]').forEach(inp=>{
        inp.addEventListener("input", e=>updatePlayerName(Number(inp.dataset.id), inp.value));
      });
      if(state.settings.imposterCount>maxImposters()){ state.settings.imposterCount=maxImposters(); }
      render.players = ()=>{};
    }

    function renderCategories(){
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">🗂️ Välj kategorier</div>
          <div class="checklist">
            ${CATEGORIES.map(c=>html`
              <label class="check">
                <input type="checkbox" ${state.selectedCategories.includes(c.id)?"checked":""} data-id="${c.id}">
                <span>${c.name}</span>
              </label>
            `).join("")}
          </div>
          <div class="stack">
            <button class="btn outline" id="all">Markera alla</button>
            <button class="btn outline" id="none">Rensa</button>
            <span class="tag">Lämna tomt för "blanda"</span>
          </div>
          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="back">← Tillbaka</button>
            <button class="btn" id="toSettings">Nästa: Inställningar</button>
          </div>
        </section>
      `;
      app.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.onchange = ()=>toggleCategory(cb.dataset.id));
      byId("all").onclick = selectAllCategories;
      byId("none").onclick = deselectAllCategories;
      byId("back").onclick = ()=>{ state.phase="home"; render(); };
      byId("toSettings").onclick = ()=>{ state.phase="settings"; render(); };
    }

    function renderSettings(){
      const diff = ["easy","medium","hard"];
      const maxImp = maxImposters();
      if(state.settings.imposterCount>maxImp){ state.settings.imposterCount=maxImp; }
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">⚙️ Inställningar</div>

          <div class="row row-2">
            <div class="card">
              <div class="title">Svårighet</div>
              <div class="stack">
                ${diff.map(d=>html`
                  <button class="btn ${state.settings.difficulty===d?"":"outline"}" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>
                `).join("")}
              </div>
            </div>

            <div class="card">
              <div class="title">Impostors</div>
              <div class="stack">
                ${[1,2].map(n=>html`
                  <button class="btn ${state.settings.imposterCount===n?"":"outline"}" data-imp="${n}" ${n>maxImp?"disabled":""}>${n}</button>
                `).join("")}
                <span class="hint">Ca 1 impostor per 3 spelare (max 2).</span>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="title">Ledtrådar</div>
            <label class="stack">
              <span class="pill">Visa hint till spelare:</span>
              <input type="checkbox" id="hints" ${state.settings.hintsEnabled?"checked":""} />
            </label>
          </div>

          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="back">← Tillbaka</button>
            <button class="btn" id="start">Starta runda</button>
          </div>
        </section>
      `;
      app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.settings.difficulty=b.dataset.d; render();});
      app.querySelectorAll('[data-imp]').forEach(b=>b.onclick=()=>{state.settings.imposterCount=Number(b.dataset.imp); render();});
      byId("hints").onchange = e=>{ state.settings.hintsEnabled = e.target.checked; };
      byId("back").onclick = ()=>{ state.phase="home"; render(); };
      byId("start").onclick = startRound;
    }

    /* Rollvisning – flip-kort (utan överlapp) */
    function renderRoleReveal(){
      const p = state.players[state.currentRevealIndex];
      const last = state.currentRevealIndex === state.players.length - 1;

      app.innerHTML = html`
        <section class="card grid center" style="min-height:60vh;text-align:center">
          <div>
            <div class="title">📣 Rollvisning</div>
            <p class="small">Ge enheten till <b>${p.name}</b>. Andra tittar bort.</p>

            <div class="flip-container">
              <div class="flip-card" id="flipCard">

                <!-- FRAMSIDA (baksidekortet) -->
                <div class="flip-side flip-front">
                  <h2 class="role-title">👤 ${p.name}</h2>
                  <p class="hint">Tryck för att vända kortet</p>
                  <button class="btn flip-button" id="flipBtn">Vänd kortet</button>
                </div>

                <!-- BAKSIDA (faktisk roll + ord) -->
                <div class="flip-side flip-back">
                  ${p.isImposter
                    ? html`
                        <h2 class="bad role-title">Du är IMPOSTOR 👀</h2>
                        ${state.settings.hintsEnabled ? html`<p class="hint">Hint: <b>${state.secretHint}</b></p>` : ""}
                        <div class="secret-wrap">
                          <span class="hint">Hemliga ordet (för crewmates):</span>
                          <div class="tag">Du ser inte ordet – bluffa trovärdigt!</div>
                        </div>
                      `
                    : html`
                        <h2 class="ok role-title">Du är CREWMATE ✅</h2>
                        <div class="secret-wrap">
                          <span class="hint">Hemliga ordet:</span>
                          <div class="secret-word">${state.secretWord}</div>
                          <span class="hint">Kategori: ${state.secretCategory}${state.settings.hintsEnabled ? " • Hint: <b>"+state.secretHint+"</b>" : ""}</span>
                        </div>
                      `
                  }
                </div>

              </div>
            </div>

            <div class="stack center" style="margin-top:20px">
              <button class="btn" id="next" style="visibility:hidden;">
                ${last ? "Starta diskussion →" : "Nästa spelare →"}
              </button>
            </div>
          </div>
        </section>
      `;

      const card = byId("flipCard");
      const btn = byId("flipBtn");
      const next = byId("next");

      const flip = () => {
        if(!card.classList.contains("flipped")){
          card.classList.add("flipped");
          next.style.visibility = "visible";
        }
      };
      btn.onclick = flip;
      card.onclick = (e) => { if (e.target.id !== "flipBtn") flip(); };

      next.onclick = () => {
        if (state.currentRevealIndex < state.players.length - 1) {
          state.currentRevealIndex++;
          render();
        } else {
          state.phase = "discussion";
          render();
        }
      };
    }

    function renderDiscussion(){
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">💬 Diskussion</div>
          <p class="hint">Varje spelare säger ett ord som anspelar på det hemliga ordet. Impostor försöker låta trovärdig utan att veta ordet.</p>

          <h3>Ordning att tala:</h3>
          <ol class="grid" style="padding-left:1.2rem">
            ${state.speakingOrder.map((p,i)=>html`<li>#${i+1} – ${p.name}</li>`).join("")}
          </ol>

          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="toTally">Räkna röster (IRL)</button>
            <span class="hint">Låt alla peka samtidigt. Välj sedan vem som fick flest röster.</span>
          </div>
        </section>
      `;
      byId("toTally").onclick = ()=>{ state.phase="tally"; render(); };
    }

    /* Rösträkning (IRL) – välj vem som blev utpekad */
    function renderTally(){
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">🗳️ Rösträkning (IRL)</div>
          <p class="hint">Vem pekade flest på? Välj person nedan. Om oavgjort eller otydligt – välj "Ingen tydlig majoritet".</p>

          <div class="pick-grid">
            ${state.players.map(p=>html`
              <div class="pick" data-pick="${p.id}">
                <div class="stack" style="align-items:center;justify-content:space-between">
                  <span class="pill">${p.isImposter ? "🕵️‍♂️" : "🧑‍🚀"}</span>
                  <b>${p.name}</b>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="sep"></div>
          <div class="stack">
            <button class="btn outline" id="none">Ingen tydlig majoritet</button>
            <button class="btn" id="calc">Visa resultat</button>
          </div>
        </section>
      `;

      let selected = null;
      app.querySelectorAll('[data-pick]').forEach(card=>{
        card.onclick = ()=>{
          app.querySelectorAll('[data-pick]').forEach(c=>c.style.borderColor="rgba(255,255,255,.15)");
          card.style.borderColor="var(--accent2)";
          selected = Number(card.dataset.pick);
        };
      });

      byId("none").onclick = ()=>{ endRound(null); };
      byId("calc").onclick = ()=>{ endRound(selected); };
    }

    function renderResults(){
      const {imposters, selectedId, selectedName, crewWon, imposterWon} = getResults();
      app.innerHTML = html`
        <section class="card grid">
          <div class="title">🏁 Resultat – Runda ${state.roundNumber-1}</div>
          <p><b>Impostors:</b> ${imposters.map(p=>p.name).join(", ") || "—"}</p>
          <p><b>Utpekad spelare:</b> ${selectedName}</p>
          <p class="${imposterWon?"bad":"ok"}"><b>${imposterWon? "Impostors vann!" : "Crew vann!"}</b></p>

          <div class="card">
            <div class="title">Hemligt ord</div>
            <p><b>Ord:</b> ${state.secretWord}</p>
            <p><b>Kategori:</b> ${state.secretCategory}</p>
            <p class="hint"><b>Ledtråd:</b> ${state.secretHint || "—"}</p>
          </div>

          <div class="sep"></div>
          <h3>Poängställning</h3>
          <ul class="players">
            ${state.players.map((p,i)=>html`
              <li>
                <span class="pill">${p.isImposter? "🕵️‍♂️" : "🧑‍🚀"}</span>
                <b>${p.name}</b>
                <span class="right tag">Poäng: ${p.score}</span>
              </li>
            `).join("")}
          </ul>

          <div class="sep"></div>
          <div class="stack">
            <button class="btn" id="again">Spela igen</button>
            <button class="btn outline" id="resetScores">Nollställ poäng</button>
            <button class="btn outline" id="resetAll">Starta om</button>
          </div>
        </section>
      `;
      byId("again").onclick = playAgain;
      byId("resetScores").onclick = resetScores;
      byId("resetAll").onclick = resetGame;
    }

    function render(){
      if(state.phase==="playerCount") return renderPlayerCount();
      if(state.phase==="home") return renderHome();
      if(state.phase==="categories") return renderCategories();
      if(state.phase==="settings") return renderSettings();
      if(state.phase==="roleReveal") return renderRoleReveal();
      if(state.phase==="discussion") return renderDiscussion();
      if(state.phase==="tally") return renderTally();
      if(state.phase==="results") return renderResults();
    }
    render(); // start
  </script>
</body>
</html>
